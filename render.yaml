# The database lives in Supabase, not on Render, so there is no `databases:`
# block here. After the first deploy, set SUPABASE_DB_URL in the Render
# dashboard (Environment tab) to the URI from
# Supabase -> Project Settings -> Database -> Connection string.
services:
  - type: web
    name: sb-lotus-tailoring
    plan: free
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SUPABASE_DB_URL
        sync: false        # set this by hand - it holds the database password
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
