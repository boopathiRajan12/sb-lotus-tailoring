[pytest]
testpaths = tests
# `tests/` is on sys.path so the suite can `from conftest import ...` helpers,
# and the project root is too so `import app` resolves.
pythonpath = . tests
filterwarnings =
    error::DeprecationWarning:models.*
    error::DeprecationWarning:routes.*
    error::DeprecationWarning:app
